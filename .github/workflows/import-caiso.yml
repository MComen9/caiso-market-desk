name: Temporary verified CAISO import
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: caiso-source-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'MComen9/caiso-market-desk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Download the pinned draft source asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/434763595" > "$RUNNER_TEMP/caiso-release.json"
          python - <<'PY_META'
          import json, os
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'caiso-release.json').read_text())
          expected = {'id': 712004538, 'name': 'CAISO-GitHub-Codex.zip', 'size': 75763658,
                      'state': 'uploaded', 'digest': 'sha256:bbf31bf387f3978cb631b1593004d77c7d2a8c0c8d2d35dbce58d45d1c21112d'}
          matches = [a for a in release.get('assets', []) if all(a.get(k) == v for k, v in expected.items())]
          if release.get('id') != 434763595 or release.get('draft') is not True or len(matches) != 1:
              raise SystemExit('Pinned draft source asset does not match; refusing import.')
          PY_META
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/712004538" > "$RUNNER_TEMP/caiso-import.zip"
      - name: Verify every source path and blob, then prepare a commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_IMPORT'
          """Validate the pinned migration ZIP and prepare a local commit; never push."""
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import stat
          import subprocess
          import zipfile

          EXPECTED_TREE = "4d08fbf82c347be9e37217d24a2c092c152b5227"
          EXPECTED_ZIP = "bbf31bf387f3978cb631b1593004d77c7d2a8c0c8d2d35dbce58d45d1c21112d"
          IMPORT_WORKFLOW = ".github/workflows/import-caiso.yml"
          tmp = Path(os.environ["RUNNER_TEMP"])
          archive = tmp / "caiso-import.zip"
          source = tmp / "caiso-import-source"
          index = tmp / "caiso-import.index"
          if source.exists() or index.exists():
              raise SystemExit("Import workspace already exists; use a fresh runner.")
          if archive.stat().st_size != 75763658:
              raise SystemExit("Source ZIP size mismatch.")
          with archive.open("rb") as stream:
              if hashlib.file_digest(stream, "sha256").hexdigest() != EXPECTED_ZIP:
                  raise SystemExit("Source ZIP SHA256 mismatch.")

          files = {}
          with zipfile.ZipFile(archive) as bundle:
              members = bundle.infolist()
              if len(members) != 551 or sum(item.file_size for item in members) != 197023796:
                  raise SystemExit("Unexpected ZIP entry count or uncompressed size.")
              for item in members:
                  name = item.filename
                  parts = name.split("/")
                  mode = item.external_attr >> 16
                  if (not parts or parts[0] != "caiso-market-desk" or len(parts) < 2
                          or any(part in ("", ".", "..", ".git") for part in parts)
                          or any(char in name for char in ("\\", "\0", "\r", "\n", "\t"))
                          or item.is_dir() or stat.S_IFMT(mode) != stat.S_IFREG):
                      raise SystemExit("Unsafe or unexpected ZIP entry: " + repr(name))
                  relative = str(PurePosixPath(*parts[1:]))
                  if relative in files:
                      raise SystemExit("Duplicate ZIP path: " + relative)
                  target = source / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with bundle.open(item) as incoming, target.open("xb") as outgoing:
                      while block := incoming.read(1024 * 1024):
                          outgoing.write(block)
                  target.chmod(0o644)
                  files[relative] = target

          env = dict(os.environ, GIT_INDEX_FILE=str(index),
                     GIT_AUTHOR_NAME="github-actions[bot]",
                     GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com",
                     GIT_COMMITTER_NAME="github-actions[bot]",
                     GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com")

          def git(*args, data=None):
              return subprocess.run(["git", *args], input=data, stdout=subprocess.PIPE,
                                    check=True, env=env).stdout

          parent = git("rev-parse", "HEAD").decode().strip()
          head_paths = set(git("ls-tree", "-rz", "--name-only", parent).decode().split("\0")) - {""}
          if not head_paths <= set(files) | {IMPORT_WORKFLOW}:
              raise SystemExit("main has unexpected paths; refusing to remove unrelated files.")
          if IMPORT_WORKFLOW not in head_paths:
              raise SystemExit("Temporary import workflow is missing from main.")
          git("read-tree", "--empty")
          entries = []
          manifest = []
          for relative, target in sorted(files.items()):
              with target.open("rb") as stream:
                  sha = subprocess.run(["git", "hash-object", "-w", "--stdin"], stdin=stream,
                                       stdout=subprocess.PIPE, check=True, env=env).stdout.decode().strip()
              manifest.append({"path": relative, "mode": "100644", "type": "blob", "sha": sha})
              entries.append(f"100644 {sha}\t{relative}\0".encode())
          git("update-index", "-z", "--index-info", data=b"".join(entries))
          actual_tree = git("write-tree").decode().strip()
          if actual_tree != EXPECTED_TREE:
              raise SystemExit("Source Git tree mismatch: " + actual_tree)

          # Verify the two source workflows were pre-positioned by the authorized connector.
          for relative in (".github/workflows/pages.yml", ".github/workflows/quality.yml"):
              if git("show", f"{parent}:{relative}") != files[relative].read_bytes():
                  raise SystemExit("Pre-positioned workflow differs: " + relative)
          import_entry = git("ls-tree", "-z", parent, "--", IMPORT_WORKFLOW)
          metadata, path = import_entry.rstrip(b"\0").split(b"\t", 1)
          mode, kind, sha = metadata.split()
          if mode != b"100644" or kind != b"blob":
              raise SystemExit("Unexpected import workflow mode or object type.")
          git("update-index", "-z", "--index-info", data=mode + b" " + sha + b"\t" + path + b"\0")
          import_tree = git("write-tree").decode().strip()
          if git("diff-tree", "-r", "--name-only", parent, import_tree, "--", ".github/workflows"):
              raise SystemExit("Import would change workflows; refusing to commit.")
          commit = git("commit-tree", import_tree, "-p", parent,
                       "-m", "Import verified CAISO source and public data snapshot").decode().strip()
          (tmp / "caiso-import-commit").write_text(commit + "\n")
          (tmp / "caiso-original-tree-elements.json").write_text(json.dumps(manifest, indent=2) + "\n")
          summary = {"source_files": len(files), "source_tree": actual_tree,
                     "import_tree": import_tree, "parent": parent, "prepared_commit": commit,
                     "workflow_changes": 0}
          print(json.dumps(summary, indent=2))
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
                  out.write("## Verified CAISO import\n\n```json\n" + json.dumps(summary, indent=2) + "\n```\n")
          PY_IMPORT
      - name: Publish the verified import by fast-forward only
        shell: bash
        run: |
          set -euo pipefail
          git push origin "$(cat "$RUNNER_TEMP/caiso-import-commit"):refs/heads/main"
